# Publishes v<package.json version> as a GitHub release from main:
# Actions → Release → "Run workflow" on main. The tag is created by the release.
# The release carries seo-shirabe-<version>-chrome.zip: unzip it and drag the
# folder onto chrome://extensions (Developer mode on).
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Resolve the tag from package.json
        run: echo "TAG=v$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - run: pnpm zip
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --target creates the tag on this main commit
          gh release create "$TAG" .output/seo-shirabe-*-chrome.zip \
            --target "$GITHUB_SHA" --title "Shirabe $TAG" --generate-notes
